name: Public source boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py
      - run: python -m unittest tests.test_publication
      - name: Install declared local artifact test dependencies
        run: python -m pip install -e '.[presentations,images]'
      - name: Qualify every registered connector boundary without live providers
        run: |
          python -B scripts/check_connector_conformance.py
          python -B -m unittest tests.test_producer_binding tests.test_document_authoring tests.test_owner_context_retention tests.test_owner_intents tests.test_gemini_tool_schema tests.test_review_followup tests.test_table_pagination tests.test_shared_efficiency
          python -B -m unittest tests.test_connector_protocol tests.test_operation_adapters tests.test_architecture_extensions tests.test_continuation_controller
          python -B -m unittest tests.test_pipeline_continuation_intent tests.test_billing_plan_recovery tests.test_record_completion_continuation
          python -B -m unittest tests.test_record_review_finalization tests.test_operation_session
          python -B -m unittest tests.test_job_owner_loop tests.test_owner_delegation tests.test_structural_review tests.test_sourcing_connector_compile
          python -B -m unittest tests.test_worker_factory.Tests.test_startup_grace_survives_controller_restart_without_false_uncertainty_or_replay tests.test_worker_factory.Tests.test_final_receipt_arriving_during_process_probe_is_collected_without_uncertainty tests.test_worker_factory.Tests.test_missing_or_foreign_terminal_receipt_cannot_confirm_completion
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/website-downloads.test.cjs tests/website-release-assets.test.cjs
