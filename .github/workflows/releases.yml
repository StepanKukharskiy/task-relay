name: Release updates
on:
  pull_request:
    paths:
      - 'task_relay/**'
      - 'tests/test_updates.py'
      - 'tests/test_update_services.py'
      - 'tests/test_onboarding.py'
      - 'tests/test_installer.py'
      - 'pyproject.toml'
      - '.github/workflows/releases.yml'
  push:
    branches: [main, 'codex/**']
    tags: ['v*.*.*']
    paths:
      - 'task_relay/**'
      - 'tests/test_updates.py'
      - 'tests/test_update_services.py'
      - 'tests/test_onboarding.py'
      - 'tests/test_installer.py'
      - 'pyproject.toml'
      - '.github/workflows/releases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py
      - run: python -m unittest tests.test_updates tests.test_update_services tests.test_onboarding tests.test_installer tests.test_bridge.Tests.test_commands_respond_while_scan_and_upload_are_blocked
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require matching stable package and runtime versions
        run: |
          python - <<'PY'
          import os,tomllib
          from task_relay.releases import VERSION,version
          version(VERSION)
          assert open('docs/release-notes.md').read().startswith('# Task Relay '+VERSION+'\n')
          assert os.environ['GITHUB_REF_NAME']=='v'+VERSION
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version']==VERSION
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: Create a reviewable release with wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --draft --verify-tag --title "Task Relay $GITHUB_REF_NAME" --notes-file docs/release-notes.md
