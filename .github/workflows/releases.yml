name: Release updates
on:
  pull_request:
    paths:
      - 'orchestrator/**'
      - 'tests/**'
      - 'scripts/qualify_lifecycle.py'
      - 'docs/shared-lifecycle-qualification.md'
      - 'task_relay/**'
      - 'tests/test_app_updates.py'
      - 'tests/companion-updates.test.cjs'
      - 'desktop/scripts/**'
      - 'tests/test_updates.py'
      - 'tests/test_migrations.py'
      - 'tests/test_update_services.py'
      - 'tests/test_onboarding.py'
      - 'tests/test_installer.py'
      - 'pyproject.toml'
      - '.github/workflows/releases.yml'
  push:
    branches: [main, 'codex/**']
    tags: ['v*.*.*']
    paths:
      - 'orchestrator/**'
      - 'tests/**'
      - 'scripts/qualify_lifecycle.py'
      - 'docs/shared-lifecycle-qualification.md'
      - 'task_relay/**'
      - 'tests/test_app_updates.py'
      - 'tests/companion-updates.test.cjs'
      - 'desktop/scripts/**'
      - 'tests/test_updates.py'
      - 'tests/test_migrations.py'
      - 'tests/test_update_services.py'
      - 'tests/test_onboarding.py'
      - 'tests/test_installer.py'
      - 'pyproject.toml'
      - '.github/workflows/releases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Shared lifecycle release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install declared local fixture dependencies
        run: python -m pip install -e '.[presentations,images]'
      - name: Require correction through exact or partial delivery
        id: lifecycle
        run: python -B scripts/qualify_lifecycle.py --output outputs/lifecycle-release
      - name: Require receipt to match the source being released
        run: python -B scripts/qualify_lifecycle.py --verify outputs/lifecycle-release/report.json
      - name: Show failed scenario diagnostics
        if: failure()
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          root=Path('outputs/lifecycle-release')
          for path in sorted(root.glob('*/result.json')):
              result=json.loads(path.read_text())
              if not result.get('passed'):
                  print(path.parent.name, flush=True)
                  print((path.parent/'tests.log').read_text()[-16000:], flush=True)
          PYTHON
      - name: Archive original journals and failed scenarios losslessly
        if: always() && steps.lifecycle.outcome != 'skipped'
        run: tar -cJf outputs/lifecycle-release.tar.xz -C outputs lifecycle-release
      - name: Retain original journals and failed scenarios
        if: always() && steps.lifecycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: shared-lifecycle-qualification
          path: outputs/lifecycle-release.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/companion-updates.test.cjs
      - run: python -m unittest tests.test_authoring tests.test_management tests.test_app_updates tests.test_desktop_app_install tests.test_update_retained_replies
      - run: python -m unittest tests.test_canvas_stopped_author.StoppedAuthor tests.test_canvas_stopped_author.StoppedPythonAuthor
      - run: python -m unittest tests.test_migrations tests.test_updates tests.test_update_services tests.test_onboarding tests.test_installer tests.test_bridge.Tests.test_commands_respond_while_scan_and_upload_are_blocked
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require matching stable package and runtime versions
        run: |
          python - <<'PY'
          import os,tomllib
          from task_relay.releases import VERSION,version
          version(VERSION)
          assert open('docs/release-notes.md').read().startswith('# Task Relay '+VERSION+'\n')
          assert os.environ['GITHUB_REF_NAME']=='v'+VERSION
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version']==VERSION
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: Create a reviewable release with wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --draft --verify-tag --title "Task Relay $GITHUB_REF_NAME" --notes-file docs/release-notes.md
