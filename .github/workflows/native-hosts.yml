name: Native host qualification
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'task_relay/assets/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native-hosts.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'task_relay/assets/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native-hosts.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.profile }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: Linux text runtime
            python: '3.11'
          - os: windows-2025
            profile: Windows processes and boundaries (execution unqualified)
            python: '3.11'
          - os: windows-2022
            profile: Windows processes and boundaries (execution unqualified)
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python scripts/qualify_native.py
      - name: Preserve only qualification reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            outputs/native-qualification/summary.json
            outputs/native-qualification/*.log
          if-no-files-found: error
          retention-days: 14
