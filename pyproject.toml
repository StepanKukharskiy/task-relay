[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-relay"
version = "0.13.26"
description = "Local project execution relay with durable task and artifact receipts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pypdf==6.18.1"]

[project.optional-dependencies]
presentations = ["python-pptx==1.0.2"]
images = ["Pillow==12.2.0"]
documents = ["python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2", "reportlab==5.0.0", "Pillow==12.2.0"]
browser = ["playwright>=1.62,<2"]
claude = ["claude-agent-sdk==0.2.152"]

[project.scripts]
task-relay = "task_relay.cli:main"

[tool.setuptools]
packages = ["task_relay", "orchestrator"]
include-package-data = false

[tool.setuptools.package-data]
task_relay = ["assets/*.png", "assets/*.html", "assets/*.css", "assets/*.js", "assets/vendor/*.js", "assets/vendor/*.LICENSE", "assets/vendor/*.txt", "assets/requirements-claude*.txt", "assets/macos/*.swift", "assets/perplexity-extension.json"]
